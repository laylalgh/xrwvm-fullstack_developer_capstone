name: Cars Dealership Lint
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python linter
        run: python -m pip install ruff
      - name: Run Linter
        run: ruff check --select E9,F63,F7,F82 server
  javascript-lint:
    name: JavaScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies and linters
        run: npm ci --prefix server/frontend
      - name: Run Linter
        working-directory: server/frontend
        run: npx --no-install eslint src --ext .js,.jsx
