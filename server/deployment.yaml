apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership
  labels:
    run: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dealership
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        run: dealership
    spec:
      containers:
        - name: dealership
          image: us.icr.io/${MY_NAMESPACE}/dealership:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DJANGO_DEBUG
              value: "0"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dealership-django
                  key: secret-key
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,${LAB_HOST}"
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: "https://${LAB_HOST}"
            - name: backend_url
              value: "${DEALERS_API_URL}"
            - name: sentiment_analyzer_url
              value: "${SENTIMENT_API_URL}"
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
